name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HARNESS_ENV_FILE: ci.harness.env
      POSTGRES_PASSWORD: ci-postgres-password
      PLATFORM_SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      PLATFORM_BOOTSTRAP_ADMIN_EMAIL: admin@example.local
      PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!Secure
      DSH_SOURCE_DIR: ../../deepseek-harness-desktop-main
      DPS_PORTAL_IMAGE: dps-platform-frontend:0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
