map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /_platform/api/ {
    proxy_pass http://platform-bff:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location ^~ /_platform/ {
    proxy_pass http://portal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  location / {
    proxy_pass http://platform-bff:3000;
    proxy_http_version 1.1;
    # The guard is injected only into HTML; JSON, SSE and WebSocket traffic is untouched.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<script src="/dps-session-guard.js"></script></head>';
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
